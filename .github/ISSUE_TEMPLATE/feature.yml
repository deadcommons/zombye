name: Feature or change
description: A concrete change you'd like to see, ideally one you or your agent could work on.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Early ideas and open questions are better in [Discussions](https://github.com/deadcommons/zombye/discussions/categories/ideas). Check the [roadmap](https://github.com/orgs/deadcommons/projects/2) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What's missing or wrong
      description: What you were trying to do, and why the game doesn't let you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Describe the change in your own words. If it's inspired by another game, describe the behaviour you want, not that game's numbers or content.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Area
      multiple: true
      options:
        - Simulation (zombies, world, combat, survival)
        - Client (rendering, input, UI)
        - Server and hosting
        - Networking and multiplayer
        - Agents and MCP
        - Art and audio
        - Modding and data files
        - Docs
  - type: dropdown
    id: help
    attributes:
      label: Would you work on it?
      options:
        - Yes, I (or my agent) would like to
        - Maybe, with some guidance
        - No, just suggesting
