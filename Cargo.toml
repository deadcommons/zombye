[workspace]
resolver = "3"
members = ["crates/sim", "crates/net", "crates/server", "crates/client"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/deadcommons/zombye"

[workspace.dependencies]
zombye-sim = { path = "crates/sim" }
zombye-net = { path = "crates/net" }
bevy = { version = "0.20", features = ["jpeg"] }
glam = { version = "0.33.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
# Compact binary encoding for save files (MIT OR Apache-2.0).
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# Fast-ish dev builds: our code lightly optimised, dependencies (Bevy) fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Playtesting: release speed in game, but our crates rebuild in seconds, not minutes (many codegen
# units, no LTO, incremental). `cargo run -p zombye-client --profile play -- ...`
[profile.play]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
