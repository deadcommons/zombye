[package]
name = "zombye-client"
description = "Zombye game client: rendering, input, audio, UI."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "zombye"
path = "src/main.rs"

[dependencies]
zombye-sim.workspace = true
zombye-net.workspace = true
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true
# Reads the furniture GLBs at startup (MIT OR Apache-2.0; Bevy uses the same crate).
gltf = { version = "1.4", default-features = false, features = ["utils", "extras"] }
