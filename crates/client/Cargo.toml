[package]
name = "zombye-client"
description = "Zombye game client: rendering, input, audio, UI."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "zombye"
path = "src/main.rs"

[dependencies]
zombye-sim.workspace = true
zombye-net.workspace = true
zombye-mods.workspace = true
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true
# The sound list (assets/data/sounds.ron), like the rest of the game's data.
ron.workspace = true
# Reads the furniture GLBs at startup (MIT OR Apache-2.0; Bevy uses the same crate).
gltf = { version = "1.4", default-features = false, features = ["utils", "extras"] }
# Half floats for the crowd's vertex animation texture (MIT OR Apache-2.0; already in Bevy's tree).
half = "2"
# The window's icon type (`release_brand.rs`); the version Bevy's window backend uses, already in its tree.
winit = { version = "0.30", default-features = false }
# Only for `--features profile` (per-system timings, `profile.rs`); both already in Bevy's tree.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry"] }

[features]
# Time every system and print the top ones at the end of `--bench-live` (adds Bevy's trace spans).
profile = ["bevy/trace", "bevy/debug", "dep:tracing", "dep:tracing-subscriber"]
# Packaged Windows builds: no console window (tools/release/package.sh).
windows-gui = []
